name: build

on:
  push:
    branches: [main]
    # The image-tag bump commit only touches deploy/, so ignoring that path
    # stops the bot's own push from re-triggering a build (identity-agnostic).
    paths-ignore:
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify
        run: make verify

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}

      - uses: imranismail/setup-kustomize@v2

      - name: Bump image tag in manifests
        run: |
          IMAGE="${IMAGE}:${GITHUB_SHA}"
          for env in k3d homelab; do
            (cd "deploy/overlays/$env" && kustomize edit set image "ghcr.io/${{ github.repository }}=${IMAGE}")
          done
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git pull --rebase
          git add deploy
          if ! git diff-index --quiet HEAD; then
            git commit -m "[skip ci] chore: bump image to ${GITHUB_SHA::7}" || echo "no changes"
            git push
          else
            echo "No changes detected, skipping push."
          fi

