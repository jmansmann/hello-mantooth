name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # Skip the tag-bump commit this job itself pushes, otherwise it re-triggers.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify
        run: make verify

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}

      - uses: imranismail/setup-kustomize@v2

      - name: Bump image tag in manifests
        run: |
          IMAGE="${IMAGE}:${GITHUB_SHA}"
          for env in k3d homelab; do
            (cd "deploy/overlays/$env" && kustomize edit set image "ghcr.io/${{ github.repository }}=${IMAGE}")
          done
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy
          git commit -m "chore: bump image to ${GITHUB_SHA::7}" || echo "no changes to commit"
          git pull --rebase --autostash
          git push
