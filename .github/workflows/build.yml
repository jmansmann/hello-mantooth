name: build

on:
  push:
    branches: [main]
    # The image-tag bump commit only touches deploy/, so ignoring that path
    # stops the bot's own push from re-triggering a build (identity-agnostic).
    paths-ignore:
      - 'deploy/**'
  workflow_dispatch:

permissions:
  # The app token handles the git write; GITHUB_TOKEN only needs to push images.
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # GitHub App with Contents: write, added to the main ruleset's bypass list.
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify
        run: make verify

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}

      - uses: imranismail/setup-kustomize@v2

      - name: Bump image tag in manifests
        run: |
          IMAGE_REF="${IMAGE}:sha-${{ steps.meta.outputs.version }}"
          for env in k3d homelab; do
            (cd "deploy/overlays/$env" && kustomize edit set image "${{ env.IMAGE }}=${IMAGE_REF}")
          done
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy
          git commit -m "[skip ci] chore: bump image to ${GITHUB_SHA::7}" || echo "no changes to commit"
          git pull --rebase --autostash
          git push
