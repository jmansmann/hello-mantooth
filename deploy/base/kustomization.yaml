apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# CI bumps newTag to the immutable git SHA on every build; `latest` is only a
# placeholder so the base renders before the first pipeline run.
images:
  - name: ghcr.io/jmansmann/hello-mantooth
    newTag: latest
