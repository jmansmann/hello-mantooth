apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-mantooth
  labels:
    app.kubernetes.io/name: hello-mantooth
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: mantooth-homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-mantooth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-mantooth
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/jmansmann/hello-mantooth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
